name: Telegram testi

on:
  push:
    branches: [main]
    paths: [".github/workflows/telegram_test.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DURUM_KLON: onceki
      DURUM_CIKTI: cikti
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: git clone -q --depth 1 --branch bulten "$GH_URL" onceki || mkdir -p onceki
      - name: Deneme mesajı gönder
        run: |
          python tg.py dene | tee sonuc.txt
          grep -q "Gönderildi: \[[0-9]" sonuc.txt || { echo "Mesaj gönderilemedi: token veya sohbet numarasını kontrol edin"; exit 1; }
      - name: Silme defterini kaydet
        if: always()
        run: python yayinla.py cikti "Telegram testi $(date -u +%FT%H%M)"
