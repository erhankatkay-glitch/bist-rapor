name: Varlık karneleri (hızlı uygulama)

# Karneler normalde kapanış taramalarıyla birlikte yazılır (teknik_bulten → karne/<piyasa>/). Bu iş ek olarak
# gün ortası tazeleme yapar ve elle tüm piyasaları yeniden üretmek için çalıştırılabilir.
on:
  schedule:
    - cron: "10 9 * * *"   # 12:10 TSİ: gün ortası tazeleme (hafta sonu yalnız kripto anlamlı değişir)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: karne-${{ github.ref }}
  cancel-in-progress: false

jobs:
  karne:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        piyasa: [bist, abd, kripto, emtia]
    env:
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Karneleri hesapla
        run: python karne.py cikti ${{ matrix.piyasa }}
      - name: Yayınla
        if: always()
        run: python yayinla.py cikti "Karneler ${{ matrix.piyasa }} $(date -u +%FT%H%M)"
