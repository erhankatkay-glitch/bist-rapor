name: Sabah raporları

on:
  schedule:
    - cron: "17 5 * * 1-5"   # Hafta içi 08:17 (Türkiye saati)
  workflow_dispatch: {}        # GitHub'dan elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python otomatik_rapor.py
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
      - name: Raporları kaydet
        run: |
          git config user.name "sabah-raporu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raporlar; [ -f hisse_listesi.csv ] && git add hisse_listesi.csv || true
          git commit -m "Sabah raporları $(date +%Y-%m-%d)" || echo "Değişiklik yok"
          git pull --rebase
          git push
