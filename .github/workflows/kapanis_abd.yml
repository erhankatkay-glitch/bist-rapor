name: ABD borsaları kapanış turları (fırsat + bülten)

on:
  schedule:
    - cron: "55 16 * * 1-5"   # 13:34 ET'de çalışır (kış 21:34, yaz 20:34 TSİ): 09:30–13:30 dilimi → 4 saatlik
    - cron: "35 19 * * 1-5"   # 16:12 ET'de çalışır (kış 00:12, yaz 23:12 TSİ): kapanış → 4 saatlik + günlük (+H/A) + bülten
  push:
    branches: [main]
    paths: [".github/tetik/abd"]   # bu dosya değişince hemen bir tur (elle tetikleme)
  workflow_dispatch:
    inputs:
      slot:
        description: "Çalıştırılacak tur"
        required: true
        default: "abd-kapanis"
      zorla:
        description: "Tatil/tazelik kontrolünü atla ve haftalık/aylık da tara (evet/hayır)"
        required: false
        default: "hayır"

concurrency:
  group: kapanis-abd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      DURUM_KLON: onceki
      DURUM_CIKTI: cikti
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Turu belirle
        id: t
        run: |
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then
            case "${{ github.event.schedule }}" in
              "55 16 * * 1-5") S=abd-ogle ;;
              "35 19 * * 1-5") S=abd-kapanis ;;
            esac
          fi
          [ -z "$S" ] && S=abd-kapanis
          Z=""; [ "${{ github.event.inputs.zorla }}" = "evet" ] && Z="--zorla"
          echo "slot=$S" >> $GITHUB_OUTPUT; echo "zorla=$Z" >> $GITHUB_OUTPUT; echo "Tur: $S $Z"
      - name: Kapanış verisini bekle (GitHub gecikmesini telafi için iş erken başlar)
        if: github.event_name == 'schedule'
        run: python kapanis.py bekle ${{ steps.t.outputs.slot }}
      - name: Önceki durumu al
        run: git clone -q --depth 1 --branch bulten "$GH_URL" onceki || mkdir -p onceki
      - name: Turu çalıştır
        run: python kapanis.py ${{ steps.t.outputs.slot }} ${{ steps.t.outputs.zorla }}
      - name: Bülten dalına yayınla
        if: always()
        run: python yayinla.py cikti "$(date -u +%FT%H%M) ${{ github.workflow }}"
