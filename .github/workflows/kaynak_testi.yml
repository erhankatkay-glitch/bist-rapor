name: Veri kaynağı testi
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt xlrd openpyxl
      - run: |
          python - <<'PY'
          import io, re, zipfile, requests, pandas as pd
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          for ad in ("acigasat.zip", "ilkislem.zip"):
              try:
                  r = requests.get("https://borsaistanbul.com/datum/" + ad, headers=UA, timeout=60)
                  print(f"== {ad} {r.status_code} {len(r.content)}")
                  z = zipfile.ZipFile(io.BytesIO(r.content)); print("  dosyalar:", z.namelist()[:10], "...", len(z.namelist()))
                  ad1 = sorted(z.namelist())[-1]; b = z.read(ad1)
                  print("  son dosya:", ad1, len(b), b[:600])
                  if ad1.lower().endswith((".xls", ".xlsx")):
                      df = pd.read_excel(io.BytesIO(b), header=None); print(df.head(15).to_string()[:2500])
              except Exception as e:
                  print("  HATA", repr(e)[:300])
          # KAP: JS içindeki api yolları
          s = requests.Session(); s.headers.update(UA)
          h = s.get("https://www.kap.org.tr/tr/bildirim-sorgu", timeout=30).text
          js = sorted(set(re.findall(r'(/_next/static/chunks/[A-Za-z0-9_\-]+\.js)', h)))
          print("KAP js:", len(js))
          bulunan = set()
          for j in js[:80]:
              try:
                  t = s.get("https://www.kap.org.tr" + j, timeout=20).text
                  for m in re.findall(r'["\'`](/?(?:tr/)?api/[A-Za-z0-9_/\-\$\{\}\.]+)', t): bulunan.add(m)
              except Exception: pass
          print("KAP api yolları:", sorted(bulunan)[:120])
          # ana sayfadaki gömülü bildirim verisi
          ana = s.get("https://www.kap.org.tr/tr", timeout=30).text
          print("ana sayfa disclosureIndex:", len(re.findall(r"disclosureIndex", ana)), ana[ana.find("disclosureIndex")-300: ana.find("disclosureIndex")+500] if "disclosureIndex" in ana else "")
          PY
