name: BIST kapanış turları (fırsat + bülten)

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 13:40 TSİ başlar, 14:17'de çalışır: 10–14 dilimi → 4 saatlik
    - cron: "45 14 * * 1-5"   # 17:45 TSİ başlar, 18:26'da çalışır: kapanış → 4 saatlik + günlük (+H/A) + bülten
  push:
    branches: [main]
    paths: [".github/tetik/bist"]   # bu dosya değişince hemen bir tur (elle tetikleme)
  workflow_dispatch:
    inputs:
      slot:
        description: "Çalıştırılacak tur"
        required: true
        default: "bist-kapanis"
      zorla:
        description: "Tatil/tazelik kontrolünü atla ve haftalık/aylık da tara (evet/hayır)"
        required: false
        default: "hayır"

concurrency:
  group: kapanis-bist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DURUM_KLON: onceki
      DURUM_CIKTI: cikti
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Turu belirle
        id: t
        run: |
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then
            case "${{ github.event.schedule }}" in
              "40 10 * * 1-5") S=bist-ogle ;;
              "45 14 * * 1-5") S=bist-kapanis ;;
            esac
          fi
          [ -z "$S" ] && S=bist-kapanis
          Z=""; [ "${{ github.event.inputs.zorla }}" = "evet" ] && Z="--zorla"
          echo "slot=$S" >> $GITHUB_OUTPUT; echo "zorla=$Z" >> $GITHUB_OUTPUT; echo "Tur: $S $Z"
      - name: Kapanış verisini bekle (GitHub gecikmesini telafi için iş erken başlar)
        if: github.event_name == 'schedule'
        run: python kapanis.py bekle ${{ steps.t.outputs.slot }}
      - name: Önceki durumu al
        run: git clone -q --depth 1 --branch bulten "$GH_URL" onceki || mkdir -p onceki
      - name: Turu çalıştır
        run: python kapanis.py ${{ steps.t.outputs.slot }} ${{ steps.t.outputs.zorla }}
      - name: Bülten dalına yayınla
        if: always()
        run: python yayinla.py cikti "$(date -u +%FT%H%M) ${{ github.workflow }}"
