name: BIST kapanış turları (fırsat + bülten)

on:
  schedule:
    - cron: "20 11 * * 1-5"   # 14:20 TSİ: 10–14 dilimi kapandı → 4 saatlik
    - cron: "35 15 * * 1-5"   # 18:35 TSİ: kapanış → 4 saatlik + günlük (+H/A) + bülten
  workflow_dispatch:
    inputs:
      slot:
        description: "Çalıştırılacak tur"
        required: true
        default: "bist-kapanis"
      zorla:
        description: "Tatil/tazelik kontrolünü atla ve haftalık/aylık da tara (evet/hayır)"
        required: false
        default: "hayır"

concurrency:
  group: kapanis-bist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DURUM_KLON: onceki
      DURUM_CIKTI: cikti
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Önceki durumu al
        run: git clone -q --depth 1 --branch bulten "$GH_URL" onceki || mkdir -p onceki
      - name: Turu çalıştır
        run: |
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then
            case "${{ github.event.schedule }}" in
              "20 11 * * 1-5") S=bist-ogle ;;
              *) S=bist-kapanis ;;
            esac
          fi
          Z=""; [ "${{ github.event.inputs.zorla }}" = "evet" ] && Z="--zorla"
          echo "Tur: $S $Z"
          python kapanis.py $S $Z
      - name: Bülten dalına yayınla
        if: always()
        run: python yayinla.py cikti "$(date -u +%FT%H%M) ${{ github.workflow }}"
