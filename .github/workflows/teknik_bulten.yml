name: Kapanış teknik bültenleri

on:
  schedule:
    - cron: "7 16 * * 1-5"   # BIST: 19:07 TSİ (kapanıştan ~1 saat sonra)
    - cron: "7 1 * * *"      # Kripto: 04:07 TSİ (günlük mum 03:00 TSİ'de kapanır)
    - cron: "7 23 * * 1-5"   # Emtia: 02:07 TSİ (ABD vadeli kapanışı 01:00 TSİ)
  workflow_dispatch:
    inputs:
      piyasa:
        description: "bist / kripto / emtia"
        required: true
        default: "bist"
      zorla:
        description: "Tatil kontrolünü atla (evet/hayır)"
        required: false
        default: "hayır"

permissions:
  contents: write

concurrency:
  group: teknik-bulten
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Piyasayı belirle
        id: p
        run: |
          case "${{ github.event.schedule }}" in
            "7 16 * * 1-5") P=bist ;;
            "7 1 * * *") P=kripto ;;
            "7 23 * * 1-5") P=emtia ;;
            *) P="${{ github.event.inputs.piyasa }}" ;;
          esac
          Z=""; [ "${{ github.event.inputs.zorla }}" = "evet" ] && Z="--zorla"
          echo "piyasa=$P" >> $GITHUB_OUTPUT; echo "zorla=$Z" >> $GITHUB_OUTPUT
      - name: Bülteni üret ve gönder
        run: python teknik_bulten.py ${{ steps.p.outputs.piyasa }} ${{ steps.p.outputs.zorla }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Bülten dalına yayınla
        if: hashFiles('cikti/**') != ''
        run: |
          P=${{ steps.p.outputs.piyasa }}
          git config --global user.name "bulten-bot"
          git config --global user.email "actions@users.noreply.github.com"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch bulten "$URL" yayin || (mkdir yayin && cd yayin && git init -q && git remote add origin "$URL")
          rm -rf "yayin/$P" && cp -r "cikti/$P" "yayin/$P"
          cd yayin
          rm -rf .git && git init -q && git checkout -q -b bulten && git remote add origin "$URL"
          git add -A && git commit -q -m "Bülten $P $(date -u +%F)"
          git push -f origin bulten
