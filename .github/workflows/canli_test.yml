name: Canlı özellik testi
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import time, traceback
          def dene(ad, fn):
              t = time.time()
              try: r = fn(); print(f"OK {ad} ({time.time()-t:.1f} sn): {r}")
              except Exception as e: print(f"HATA {ad}: {e!r}"); traceback.print_exc()
          import bist_borsa as BB, bist_rapor as br, bist_varlik as V, bist_teknik as T, bist_ileri as IL, alarm as A
          def kripto():
              f, m = V.rapor("BTC/TRY", "/tmp")
              return {"mikro": V.AN.ileri_cumleler(m, "TL"), "defi": (m.get("defi") or {}).get("protokol"), "sayfa": f}
          dene("kripto raporu BTC/TRY", kripto)
          dene("ETH/USDT defi", lambda: (V.analiz("ETH/USDT").get("defi") or {}).get("protokol"))
          dene("AAVE/USDT defi", lambda: (V.analiz("AAVE/USDT").get("defi") or {}).get("protokol"))
          d = br.veri_cek("THYAO")
          dene("ileri paket", lambda: list(IL.ileri_paket(d["hist"]).keys()))
          dene("bilanço tarihleri", lambda: IL.bilanco_tarihleri("THYAO")[1])
          dene("veri_cek tekrar", lambda: len(br.veri_cek("ASELS")["hist"]))
          dene("analiz_et toplam", lambda: br.analiz_et("ASELS", log=lambda x: None)[1]["guven"])
          dene("alarm biçim", lambda: A.tara(A.kurallar("THYAO > 1\nBTC/USDT %0,1"), {})[0])
          PY
