name: Kalite denetimi (test)

on:
  push:
    branches: [denetim]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ta playwright
      - name: Denetim
        run: python denetim.py 2>&1 | tee denetim_log.txt
      - name: Sonuçları kaydet
        if: always()
        run: |
          mkdir -p denetim; cp denetim_log.txt denetim/ || true; cp -r denetim_graf/. denetim/ || true
          cd denetim
          git init -q -b denetim-cikti; git config user.name denetim; git config user.email actions@users.noreply.github.com
          git add -A; git commit -qm "denetim $(date -u +%FT%H%M)"
          git push -qf "$GH_URL" denetim-cikti
