name: Alarm, haber etkisi ve Telegram temizliği

on:
  schedule:
    - cron: "*/30 * * * *"   # 30 dakikada bir: alarmlar + zamanı gelen Telegram mesajlarını sil
  push:
    branches: [main]
    paths: ["haber.py", "alarm.py", "alarmlar.txt"]   # bu dosyalar güncellenince hemen bir tur çalışsın
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alarm
  cancel-in-progress: false

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DURUM_KLON: onceki
      DURUM_CIKTI: cikti
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Önceki durumu al
        run: |
          git clone -q --depth 1 --branch bulten "$GH_URL" onceki || mkdir -p onceki
          mkdir -p alarm_cikti && cp onceki/alarm/*.json alarm_cikti/ 2>/dev/null || true
      - name: Alarmları kontrol et
        run: python alarm.py
      - name: Haber etkisi taraması
        if: always()
        run: python haber.py
      - name: Yabancı yatırımcı akışı (TCMB, haftalık)
        if: always()
        continue-on-error: true
        run: python yabanci_akis.py bildir
      - name: Telegram'da zamanı gelen mesajları sil
        if: always()
        run: python tg.py temizle
      - name: Durumu kaydet
        if: always()
        run: |
          mkdir -p cikti/alarm && cp alarm_cikti/*.json cikti/alarm/ 2>/dev/null || true
          python yayinla.py cikti "Alarm $(date -u +%FT%H%M)"
