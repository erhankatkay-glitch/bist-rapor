name: FiboAyna strateji araştırması

# Kullanıcının FiboAyna göstergesi (şifreli: ozel/fibo.enc, anahtar FIBO_ANAHTAR) ile geçmiş test; sonuçlar iş çıktısı (artifact)
on:
  workflow_dispatch:
    inputs:
      piyasalar:
        description: 'Piyasalar (JSON liste)'
        required: false
        default: '["bist","abd","kripto","emtia"]'
      adet:
        description: 'Piyasa başına sembol'
        required: false
        default: '150'

permissions:
  contents: write

jobs:
  arastirma:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        piyasa: ${{ fromJSON(inputs.piyasalar || '["bist","abd","kripto","emtia"]') }}
    env:
      FIBO_ANAHTAR: ${{ secrets.FIBO_ANAHTAR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cryptography numba
      - name: Araştırma
        run: python fibo_yukle.py fibo_arastirma fibo_cikti ${{ matrix.piyasa }} ${{ inputs.adet || '150' }}
      - name: Sonuçları şifrele ve fibo-sonuc dalına yaz
        if: success()
        env:
          GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          YAYIN_DAL: fibo-sonuc
        run: |
          mkdir -p sifreli && python fibo_yukle.py sifrele fibo_cikti sifreli/fibo-${{ matrix.piyasa }}.enc
          python yayinla.py sifreli "FiboAyna ${{ matrix.piyasa }} $(date -u +%FT%H%M)"

  analiz:
    needs: arastirma
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIBO_ANAHTAR: ${{ secrets.FIBO_ANAHTAR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cryptography
      - name: Şifreli sonuçları al
        run: git clone -q --depth 1 --branch fibo-sonuc "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gelen
      - name: Çöz ve analiz et (rapor yalnız şifreli çıktıda)
        run: |
          python - <<'PY'
          import glob, io, os, zipfile
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["FIBO_ANAHTAR"].strip().encode())
          for p in [x for x in glob.glob("gelen/fibo-*.enc") if not x.endswith("fibo-analiz.enc")]:
              zipfile.ZipFile(io.BytesIO(f.decrypt(open(p, "rb").read()))).extractall("veri/" + os.path.basename(p)[:-4])
          PY
          python fibo_yukle.py fibo_analiz veri > veri/rapor.txt 2>&1 || true
          tail -3 veri/rapor.txt | cut -c1-40
          mkdir -p sifreli && python fibo_yukle.py sifrele veri sifreli/fibo-analiz.enc
      - name: Analizi yaz
        env:
          GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          YAYIN_DAL: fibo-sonuc
        run: python yayinla.py sifreli "FiboAyna analiz $(date -u +%FT%H%M)"
