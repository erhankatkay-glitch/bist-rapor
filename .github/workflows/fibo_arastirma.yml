name: FiboAyna strateji araştırması

# Kullanıcının FiboAyna göstergesi (şifreli: ozel/fibo.enc, anahtar FIBO_ANAHTAR) ile geçmiş test; sonuçlar iş çıktısı (artifact)
on:
  workflow_dispatch:
    inputs:
      piyasalar:
        description: 'Piyasalar (JSON liste)'
        required: false
        default: '["bist","abd","kripto","emtia"]'
      adet:
        description: 'Piyasa başına sembol'
        required: false
        default: '150'

permissions:
  contents: read

jobs:
  arastirma:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        piyasa: ${{ fromJSON(inputs.piyasalar || '["bist","abd","kripto","emtia"]') }}
    env:
      FIBO_ANAHTAR: ${{ secrets.FIBO_ANAHTAR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cryptography numba
      - name: Araştırma
        run: python fibo_yukle.py fibo_arastirma fibo_cikti ${{ matrix.piyasa }} ${{ inputs.adet || '150' }}
      - name: Sonuçları şifrele
        if: always()
        run: mkdir -p sifreli && python fibo_yukle.py sifrele fibo_cikti sifreli/fibo-${{ matrix.piyasa }}.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fibo-${{ matrix.piyasa }}
          path: sifreli/
          retention-days: 30

  analiz:
    needs: arastirma
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIBO_ANAHTAR: ${{ secrets.FIBO_ANAHTAR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt cryptography
      - uses: actions/download-artifact@v4
        with:
          path: gelen
      - name: Çöz ve analiz et (rapor yalnız şifreli çıktıda)
        run: |
          python - <<'PY'
          import glob, io, os, zipfile
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["FIBO_ANAHTAR"].strip().encode())
          for p in glob.glob("gelen/**/*.enc", recursive=True):
              zipfile.ZipFile(io.BytesIO(f.decrypt(open(p, "rb").read()))).extractall("veri/" + os.path.basename(p)[:-4])
          PY
          python fibo_yukle.py fibo_analiz veri > veri/rapor.txt 2>&1 || true
          tail -3 veri/rapor.txt | cut -c1-40
          mkdir -p sifreli && python fibo_yukle.py sifrele veri sifreli/fibo-analiz.enc
      - uses: actions/upload-artifact@v4
        with:
          name: fibo-analiz
          path: sifreli/
          retention-days: 30
