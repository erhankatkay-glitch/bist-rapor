name: Kripto kapanış turları (fırsat + bülten)

on:
  schedule:
    - cron: "22 0,4,8,12,16,20 * * *"   # her 4 saatlik mum kapanışından ~22 dk sonra (03:22, 07:22 … TSİ); 03:22'de günlük + bültenler
  workflow_dispatch:
    inputs:
      slot:
        description: "Çalıştırılacak tur"
        required: true
        default: "kripto"
      zorla:
        description: "Tatil/tazelik kontrolünü atla ve haftalık/aylık da tara (evet/hayır)"
        required: false
        default: "hayır"

concurrency:
  group: kapanis-kripto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DURUM_KLON: onceki
      DURUM_CIKTI: cikti
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Önceki durumu al
        run: git clone -q --depth 1 --branch bulten "$GH_URL" onceki || mkdir -p onceki
      - name: Turu çalıştır
        run: |
          S="${{ github.event.inputs.slot }}"
          if [ -z "$S" ]; then
            S=kripto
          fi
          Z=""; [ "${{ github.event.inputs.zorla }}" = "evet" ] && Z="--zorla"
          echo "Tur: $S $Z"
          python kapanis.py $S $Z
      - name: Bülten dalına yayınla
        if: always()
        run: python yayinla.py cikti "$(date -u +%FT%H%M) ${{ github.workflow }}"
