name: Kripto canlı test
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import time, bist_kripto as KR, bist_varlik as V, bist_teknik as T
          t=time.time(); ev = KR.evren(); print("EVREN", len(ev), ev.attrs.get("not"), "TRY Binance:", int(ev["Binance TRY"].sum()), "TRY OKX:", int(ev["OKX TRY"].sum()), round(time.time()-t,1),"sn")
          print(ev.head(8).to_string())
          for k in ("BTC/TRY", "PEPE/USDT", "SOL/TRY@OKX"):
              t=time.time()
              try:
                  f, m = V.rapor(k, "/tmp")
                  print("RAPOR", k, m["kod"], m["ad"], m["para"], round(m["fiyat"], 6), m["gorunum"], "borsa:", m.get("borsa"), "cg:", bool(m.get("cg")), "mta:", (m.get("mta") or {}).get("etiket"), round(time.time()-t,1), "sn")
              except Exception as e:
                  import traceback; print("RAPOR HATA", k, repr(e)); traceback.print_exc()
          s = T.analiz("PEPE/TRY"); print("TEKNIK", s["kod"], s["ad"], s["etiket"], len(s["tf"]["G"]["h"]), "gün")
          PY
