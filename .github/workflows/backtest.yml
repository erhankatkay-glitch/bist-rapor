name: Haftalık backtest

on:
  schedule:
    - cron: "41 6 * * 0"   # Pazar 09:41 (Türkiye saati)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python otomatik_backtest.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raporlar
          git commit -m "Backtest $(date +%Y-%m-%d)" || echo "Değişiklik yok"
          git pull --rebase
          git push
