name: PWA (GitHub Pages)

# Aşama 15: pwa/ klasörünü ücretsiz GitHub Pages'te yayınlar → telefona "Ana Ekrana Ekle" ile kurulan uygulama.
# Veriyi tarayıcıda doğrudan bulten dalından (raw.githubusercontent.com) ve Binance'ten okur; sunucu gerekmez.
on:
  push:
    branches: [main]
    paths: ["pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: dagit
        uses: actions/deploy-pages@v4
